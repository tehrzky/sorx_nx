name: Build OpenBOR Switch NRO

on:
  push:
    branches: [ main, master, OpenBOR-NX ]
  pull_request:
    branches: [ main, master, OpenBOR-NX ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NRO
        shell: bash
        run: |
          make -j$(nproc)

      - name: Check SDL2's real library dependencies
        shell: bash
        run: |
          READELF=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf
          echo "--- libSDL2.so NEEDED libraries ---"
          "$READELF" -d debug/libSDL2.so | grep NEEDED
          echo "--- libavcodec.so NEEDED libraries ---"
          "$READELF" -d debug/libavcodec.so | grep NEEDED 2>/dev/null || echo "not present at debug/libavcodec.so"

      # Find the generated ELF file and store its name
      - name: Locate ELF file
        id: find_elf
        shell: bash
        run: |
          ELF=$(ls *.elf 2>/dev/null | head -n1)
          if [ -z "$ELF" ]; then
            echo "No .elf file found!"
            exit 1
          fi
          echo "ELF=$ELF" >> $GITHUB_OUTPUT
          echo "Found ELF: $ELF"

      # Resolve crash addresses using the found ELF
      - name: Resolve crash addresses
        shell: bash
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line -f -C -e ${{ steps.find_elf.outputs.ELF }} \
            0x411244 0x414de4 0xf744 0x13a0 0xd20

      # Look up which function contains the SVC at handler+0x3e7a3c
      - name: Locate SVC function in ELF
        shell: bash
        run: |
          NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          A2L=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line
          ELF="${{ steps.find_elf.outputs.ELF }}"

          echo "===== handler address ====="
          HANDLER_LINE=$($NM "$ELF" | grep __libnx_exception_handler || true)
          echo "$HANDLER_LINE"

          H=$(echo "$HANDLER_LINE" | awk '{print $1}')
          if [ -z "$H" ]; then
            echo "Could not find __libnx_exception_handler in symbol table"
            exit 0
          fi

          for OFF in 0x3e7d8c 0x3e7d7c 0x3e7d1c 0x3e7a3c; do
            TARGET=$(printf "0x%x" $((0x$H + $OFF)))
            echo "===== handler + $OFF = $TARGET ====="
            $A2L -f -C -e "$ELF" "$TARGET"
            echo
          done

          echo "===== 40 instructions around target ====="
          DUMP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objdump
          $DUMP -d "$ELF" > /tmp/dis.txt
          ADDR_HEX=$(printf "%x" $((0x$H + 0x3e7a3c)))
          LINE=$(grep -n "$ADDR_HEX" /tmp/dis.txt | head -n1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE - 40))
            [ $START -lt 1 ] && START=1
            END=$((LINE + 10))
            sed -n "${START},${END}p" /tmp/dis.txt
          else
            echo "target address not found in disassembly"
          fi

      # Resolve a fault address inside libSDL2.so
      - name: Locate fault function in libSDL2.so
        shell: bash
        run: |
          A2L=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line
          DUMP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objdump

          SO=debug/libSDL2.so
          if [ ! -f "$SO" ]; then
            SO=libSDL2.so
          fi
          if [ ! -f "$SO" ]; then
            echo "libSDL2.so not found -- skipping"
            exit 0
          fi

          echo "===== addr2line libSDL2.so+0x1b3144 ====="
          $A2L -f -C -e "$SO" 0x1b3144

          echo "===== 40 instructions around libSDL2.so+0x1b3144 ====="
          $DUMP -d "$SO" > /tmp/sdl2.dis
          LINE=$(grep -n "1b3144" /tmp/sdl2.dis | head -n1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE - 40))
            [ $START -lt 1 ] && START=1
            END=$((LINE + 10))
            sed -n "${START},${END}p" /tmp/sdl2.dis
          else
            echo "0x1b3144 not found in libSDL2.so disassembly"
          fi

          echo "===== 80 instructions BEFORE AttachCurrentThread (the caller) ====="
          LINE=$(grep -n "^  1b3128:" /tmp/sdl2.dis | head -n1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$((LINE - 80))
            [ $START -lt 1 ] && START=1
            END=$((LINE - 1))
            sed -n "${START},${END}p" /tmp/sdl2.dis
          else
            echo "1b3128 not found in disassembly"
          fi

      # Upload ELF for future debugging
      - name: Upload ELF for future crash lookups
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch-elf
          path: ${{ steps.find_elf.outputs.ELF }}

      # Upload the final NRO and NACP
      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch
          path: |
            *.nro
            *.nacp
