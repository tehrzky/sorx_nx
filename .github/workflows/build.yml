name: Build OpenBOR Switch NRO

on:
  push:
    branches: [ main, master, OpenBOR-NX ]
  pull_request:
    branches: [ main, master, OpenBOR-NX ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NRO
        shell: bash
        run: |
          make -j$(nproc)

      - name: Disassemble libSDL2.so around the crash site
        shell: bash
        run: |
          OBJDUMP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objdump
          if [ ! -x "$OBJDUMP" ]; then
            echo "Not found at expected path, searching..."
            OBJDUMP=$(find /opt/devkitpro -name 'aarch64-none-elf-objdump' | head -1)
          fi
          echo "Using: $OBJDUMP"
          
          # Try multiple possible locations
          if [ -f "sorx_nx/debug/libSDL2.so" ]; then
            SO_PATH="sorx_nx/debug/libSDL2.so"
          elif [ -f "debug/libSDL2.so" ]; then
            SO_PATH="debug/libSDL2.so"
          elif [ -f "sorx_nx/source/debug/libSDL2.so" ]; then
            SO_PATH="sorx_nx/source/debug/libSDL2.so"
          else
            echo "ERROR: libSDL2.so not found in any expected location!"
            echo "Searching for libSDL2.so..."
            find . -name "libSDL2.so" 2>/dev/null || echo "No libSDL2.so found"
            echo "Contents of current directory:"
            ls -la
            echo "Contents of sorx_nx/ if it exists:"
            ls -la sorx_nx/ 2>/dev/null || echo "sorx_nx/ doesn't exist"
            exit 1
          fi
          
          echo "Found libSDL2.so at: $SO_PATH"
          
          # Check if it's a valid ELF file
          file "$SO_PATH"
          
          # Try disassembly
          "$OBJDUMP" -d "$SO_PATH" > /tmp/sdl2_disasm.txt || {
            echo "objdump failed with exit code $?"
            cat /tmp/sdl2_disasm.txt 2>/dev/null || echo "No output generated"
            exit 1
          }
          
          echo "Disassembly successful, searching for svc instructions..."
          grep -n -B6 -A2 "svc" /tmp/sdl2_disasm.txt || echo "No svc instructions found"

      # Find the generated ELF file and store its name
      - name: Locate ELF file
        id: find_elf
        shell: bash
        run: |
          ELF=$(ls *.elf 2>/dev/null | head -n1)
          if [ -z "$ELF" ]; then
            echo "No .elf file found!"
            exit 1
          fi
          echo "ELF=$ELF" >> $GITHUB_OUTPUT
          echo "Found ELF: $ELF"

      # Resolve crash addresses using the found ELF
      - name: Resolve crash addresses
        shell: bash
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line -f -C -e ${{ steps.find_elf.outputs.ELF }} \
            0x411244 0x414de4 0xf744 0x13a0 0xd20

      # Upload ELF for future debugging
      - name: Upload ELF for future crash lookups
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch-elf
          path: ${{ steps.find_elf.outputs.ELF }}

      # Upload the final NRO and NACP
      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch
          path: |
            *.nro
            *.nacp
