name: Build OpenBOR Switch NRO

on:
  push:
    branches: [ main, master, IkemenGO, OpenBOR-NX ]
  pull_request:
    branches: [ main, master, IkemenGO, OpenBOR-NX ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NRO
        shell: bash
        run: |
          make -j$(nproc)

      # NEW: Resolve crash addresses using the ELF file
      - name: Resolve crash addresses
        shell: bash
        run: |
          $DEVKITA64/bin/aarch64-none-elf-addr2line -f -C -e openbor_nx.elf \
            0x411244 0x414de4 0xf744 0x13a0 0xd20

      # NEW: Upload the ELF file for future debugging
      - name: Upload ELF for future crash lookups
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch-elf
          path: openbor_nx.elf

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch
          path: |
            *.nro
            *.nacp            *.nro
            *.nacp
