name: Build OpenBOR Switch NRO

on:
  push:
    branches: [ main, master, OpenBOR-NX ]
  pull_request:
    branches: [ main, master, OpenBOR-NX ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NRO
        shell: bash
        run: |
          make -j$(nproc)

      # New simplified disassembly step
       - name: Map crash address to a real file location
        shell: bash
        run: |
          READELF=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf
          OBJDUMP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objdump
          SO_PATH="debug/libSDL2.so"

          echo "--- Program headers (segments) ---"
          "$READELF" -l "$SO_PATH"

          echo "--- Section headers ---"
          "$READELF" -S "$SO_PATH"

          echo "--- Symbol at/near runtime offset 0x54294 (if any symbols remain) ---"
          "$OBJDUMP" -t "$SO_PATH" | sort -k1 | awk -v target=0x54294 '
            { addr = strtonum("0x" $1); if (addr <= strtonum(target)) last = $0 }
            END { print last }
          '

      # Find the generated ELF file and store its name
      - name: Locate ELF file
        id: find_elf
        shell: bash
        run: |
          ELF=$(ls *.elf 2>/dev/null | head -n1)
          if [ -z "$ELF" ]; then
            echo "No .elf file found!"
            exit 1
          fi
          echo "ELF=$ELF" >> $GITHUB_OUTPUT
          echo "Found ELF: $ELF"

      # Resolve crash addresses using the found ELF
      - name: Resolve crash addresses
        shell: bash
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line -f -C -e ${{ steps.find_elf.outputs.ELF }} \
            0x411244 0x414de4 0xf744 0x13a0 0xd20

      # Upload ELF for future debugging
      - name: Upload ELF for future crash lookups
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch-elf
          path: ${{ steps.find_elf.outputs.ELF }}

      # Upload the final NRO and NACP
      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch
          path: |
            *.nro
            *.nacp
