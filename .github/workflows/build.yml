name: Build OpenBOR Switch NRO

on:
  push:
    branches: [ main, master, OpenBOR-NX ]
  pull_request:
    branches: [ main, master, OpenBOR-NX ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NRO
        shell: bash
        run: |
          make -j$(nproc)

       - name: Disassemble libSDL2.so around the crash site
        shell: bash
        run: |
          OBJDUMP=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-objdump
          if [ ! -x "$OBJDUMP" ]; then
            echo "Not found at expected path, searching..."
            OBJDUMP=$(find /opt/devkitpro -name 'aarch64-none-elf-objdump' | head -1)
          fi
          echo "Using: $OBJDUMP"
          "$OBJDUMP" -d debug/libSDL2.so > /tmp/sdl2_disasm.txt
          grep -n -B6 -A2 "svc" /tmp/sdl2_disasm.txt

      # Find the generated ELF file and store its name
      - name: Locate ELF file
        id: find_elf
        shell: bash
        run: |
          ELF=$(ls *.elf 2>/dev/null | head -n1)
          if [ -z "$ELF" ]; then
            echo "No .elf file found!"
            exit 1
          fi
          echo "ELF=$ELF" >> $GITHUB_OUTPUT
          echo "Found ELF: $ELF"

      # Resolve crash addresses using the found ELF
      - name: Resolve crash addresses
        shell: bash
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-addr2line -f -C -e ${{ steps.find_elf.outputs.ELF }} \
            0x411244 0x414de4 0xf744 0x13a0 0xd20

      # Upload ELF for future debugging
      - name: Upload ELF for future crash lookups
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch-elf
          path: ${{ steps.find_elf.outputs.ELF }}

      # Upload the final NRO and NACP
      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbor-switch
          path: |
            *.nro
            *.nacp
